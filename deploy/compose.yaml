name: zhihu-qa-oauth

services:
  oauth:
    build: .
    environment:
      ZHIHU_OAUTH_APP_ID: "${ZHIHU_OAUTH_APP_ID:-}"
      ZHIHU_OAUTH_APP_KEY: "${ZHIHU_OAUTH_APP_KEY:-}"
      ZHIHU_OAUTH_USERINFO_URL: "${ZHIHU_OAUTH_USERINFO_URL:-}"
      ZHIHU_OAUTH_USERINFO_PATH: "${ZHIHU_OAUTH_USERINFO_PATH:-}"
      ZHIHU_OAUTH_USERINFO_ID_FIELD: "${ZHIHU_OAUTH_USERINFO_ID_FIELD:-id}"
      ZHIHU_OAUTH_USERINFO_NAME_FIELD: "${ZHIHU_OAUTH_USERINFO_NAME_FIELD:-name}"
      ZHIHU_OAUTH_ACCESS_SECRET: "${ZHIHU_OAUTH_ACCESS_SECRET:-}"
    ports:
      - '127.0.0.1:33111:33111'
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:33111/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
