name: zhihu-qa-oauth

services:
  oauth:
    build: .
    ports:
      - '127.0.0.1:33111:33111'
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:33111/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
